services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zephyr
      POSTGRES_PASSWORD: zephyr
      POSTGRES_DB: zephyr
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zephyr -d zephyr"]
      interval: 2s
      timeout: 5s
      retries: 30

  auth:
    build:
      context: ./infra/firebase
    ports:
      - "9099:9099"
    volumes:
      - ./infra/firebase:/firebase

  minio:
    image: adobe/s3mock:latest
    environment:
      initialBuckets: zephyr-photos
    ports:
      - "9000:9090"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      PORT: "8080"
      ZEPHYR_STORE: postgres
      DATABASE_URL: postgres://zephyr:zephyr@postgres:5432/zephyr
      S3_ENDPOINT: minio
      S3_PORT: "9090"
      S3_ACCESS_KEY: zephyr
      S3_SECRET_KEY: zephyr-secret
      S3_BUCKET: zephyr-photos
      FIREBASE_AUTH_EMULATOR_HOST: auth:9099
      AUTH_EMULATOR_PUBLIC_HOST: 127.0.0.1:9099
      FIREBASE_PROJECT_ID: zephyr-local
      FIREBASE_API_KEY: demo-key
      ZEPHYR_DATA_DIR: /data
      ZEPHYR_FIXTURES: /fixtures
      WORKER_URL: http://worker:8081
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      auth:
        condition: service_started
      worker:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      PORT: "8081"
      ZEPHYR_STORE: postgres
      DATABASE_URL: postgres://zephyr:zephyr@postgres:5432/zephyr
      S3_ENDPOINT: minio
      S3_PORT: "9090"
      S3_ACCESS_KEY: zephyr
      S3_SECRET_KEY: zephyr-secret
      S3_BUCKET: zephyr-photos
      ZEPHYR_DATA_DIR: /data
      ZEPHYR_FIXTURES: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  # Pub/Sub emulator for local async (optional; file-queue works without it)
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
